<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>ReRun — reactive MATLAB notebook</title>
  <link rel="stylesheet" href="./style.css?v=__V__">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>⟳</text></svg>">
</head>
<body data-v="__V__">
  <header>
    <span class="wordmark">Re<b>Run</b> <span class="mark">⟳</span></span>
    <span class="tag">reactive MATLAB · RunMat · in-browser</span>
    <nav>
      <label class="auto-label" title="rerun dependents automatically as you type">
        <input type="checkbox" id="auto" checked> reactive
      </label>
      <button id="run-all" title="run every cell in dependency order">run all</button>
      <button id="add-cell">+ cell</button>
      <button id="export" title="download as a plain .m that runs top-to-bottom">export .m</button>
      <label class="file-btn">import<input type="file" id="import" accept=".m,text/plain" hidden></label>
      <button id="reset" title="restore the demo notebook">demo</button>
      <button id="pair" title="let an agent drive this notebook while you watch">pair</button>
    </nav>
    <span id="status">booting…</span>
  </header>
  <div id="pair-banner" hidden></div>

  <main>
    <div id="cells" class="cells"></div>
    <aside class="varpanel">
      <div class="varhead">workspace <span id="dag-stat"></span></div>
      <table>
        <thead><tr><th>name</th><th>value</th><th>type</th><th>cell</th></tr></thead>
        <tbody id="vars"></tbody>
      </table>
      <p class="varhint">page order is cosmetic — cells run in dependency order.
        edit any cell and everything downstream reruns.</p>
    </aside>
  </main>

  <script type="module" src="./app.js?v=__V__"></script>
</body>
</html>
